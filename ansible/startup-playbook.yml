---
- hosts: localhost
  connection: local

  ## Configuration variables
  vars:
    # Specify packages to install using apt
    apt_packages: "{{ linuxbrew_dependencies }}"


  vars_files:
    - install/brew/vars.yml
    - install/tools/vars.yml


  ## Other tasks to execute after the roles
  tasks:
    - name: Install apt packages
      become: true
      when: apt_packages | length > 0
      ansible.builtin.apt:
        pkg: "{{ apt_packages }}"
        autoclean: true
        autoremove: true
        install_recommends: false
        update_cache: true
        state: present
    - name: Install Homebrew
      ansible.builtin.include_tasks: install/brew/installer.yml

    # Install linuxbrew packages
    - name: Install Linuxbrew packages
      ansible.builtin.include_tasks: install/tools/installer.yml
