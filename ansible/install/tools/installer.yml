---
- name: Install Homebrew packages
  ansible.builtin.command: "{{ linuxbrew_prefix }}/bin/brew install {{ item }}"
  loop: "{{ brew_packages }}"

- name: Check if .bashrc exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.bashrc"
  register: bashrc_st

- name: Check if .zshrc exists
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.zshrc"
  register: zshrc_st

- name: Configure tools in shell
  ansible.builtin.include_tasks: "config/{{ item }}.yml"
  loop: "{{ tools_with_config }}"
