# BoxBox Configuration

# Server settings
port: 80
host: "0.0.0.0"

# JWT authentication secret. Override with BOXBOX_JWT_SECRET env var.
jwt_secret: "change-me-in-production-use-a-long-random-string"

# Users can also be configured with BOXBOX_USERS_<username> environment variables.
# users:
#   admin: "change-me"

# Auth endpoint rate limit per client IP.
rate_limit_rps: 10

# Optional WebSocket/CORS origin allow-list.
# Empty list allows all origins.
allowed_origins: []

# Upload settings
max_upload_mb: 10240  # 10GB
chunk_size_mb: 5

# Mount points visible in the file manager UI
mount_points:
  - name: "drives"
    path: "/media/devmon"
    read_only: false
    auto_discover: true

  - name: "mnt"
    path: "/mnt"
    read_only: false

  - name: "root"
    path: "/host_root"
    read_only: true

  - name: "home"
    path: "/home/user"
    read_only: false

  - name: "desktop"
    path: "/home/user/Desktop"
    read_only: false

  - name: "downloads"
    path: "/home/user/Downloads"
    read_only: false

  - name: "documents"
    path: "/home/user/Documents"
    read_only: false

  - name: "music"
    path: "/home/user/Music"
    read_only: false

  - name: "pictures"
    path: "/home/user/Pictures"
    read_only: false

  - name: "videos"
    path: "/home/user/Videos"
    read_only: false
