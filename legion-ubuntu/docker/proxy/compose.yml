services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - pocketid-internal
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/etc/traefik
      - ./data:/data
    command:
      # API and Dashboard
      - --api.dashboard=true
      - --api.insecure=false

      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # Logging
      - --log.level=INFO
      - --accesslog=true

      # Let's Encrypt DNS-01 Challenge
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    labels:
      - "traefik.enable=true"

      # Request wildcard certificate for all subdomains
      - "traefik.http.routers.traefik-wildcard.rule=Host(`${DOMAIN}`) || HostRegexp(`{subdomain:[a-z]+}.${DOMAIN}`)"
      - "traefik.http.routers.traefik-wildcard.tls=true"
      - "traefik.http.routers.traefik-wildcard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-wildcard.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.traefik-wildcard.tls.domains[0].sans=*.${DOMAIN}"

      # Dashboard router - accessible at dashboard subdomain
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"

  tinyauth:
    container_name: tinyauth
    image: ghcr.io/steveiliop56/tinyauth:v4
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - APP_URL=${TINYAUTH_APPURL}
      - USERS=${TINYAUTH_AUTH_USERS}
      - OAUTH_AUTO_REDIRECT=pocketid
      - PROVIDERS_POCKETID_CLIENT_ID=${TINYAUTH_PROVIDERS_POCKETID_CLIENT_ID}
      - PROVIDERS_POCKETID_CLIENT_SECRET=${TINYAUTH_PROVIDERS_POCKETID_CLIENT_SECRET}
      - PROVIDERS_POCKETID_AUTH_URL=${TINYAUTH_PROVIDERS_POCKETID_AUTH_URL}
      - PROVIDERS_POCKETID_TOKEN_URL=${TINYAUTH_PROVIDERS_POCKETID_TOKEN_URL}
      - PROVIDERS_POCKETID_USER_INFO_URL=${TINYAUTH_PROVIDERS_POCKETID_USER_INFO_URL}
      - PROVIDERS_POCKETID_REDIRECT_URL=${TINYAUTH_PROVIDERS_POCKETID_REDIRECT_URL}
      - PROVIDERS_POCKETID_SCOPES=${TINYAUTH_PROVIDERS_POCKETID_SCOPES}
      - PROVIDERS_POCKETID_NAME=${TINYAUTH_PROVIDERS_POCKETID_NAME}
    volumes:
      - tinyauth-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # Tinyauth web UI router - on apps subdomain
      - "traefik.enable=true"
      - "traefik.http.routers.tinyauth.rule=Host(`apps.${DOMAIN}`)"
      - "traefik.http.routers.tinyauth.entrypoints=websecure"
      - "traefik.http.routers.tinyauth.tls=true"
      - "traefik.http.routers.tinyauth.tls.certresolver=letsencrypt"
      - "traefik.http.services.tinyauth.loadbalancer.server.port=3000"

      # ForwardAuth middleware definition
      - "traefik.http.middlewares.tinyauth.forwardauth.address=http://tinyauth:3000/api/auth/traefik"
      - "traefik.http.middlewares.tinyauth.forwardauth.trustForwardHeader=true"

  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocketid
    restart: unless-stopped
    depends_on:
      - pocketid-db
    networks:
      - proxy
      - pocketid-internal
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - PUBLIC_APP_URL=https://auth.${DOMAIN}
      - APP_URL=https://auth.${DOMAIN}
      - TRUST_PROXY=true
      - DB_CONNECTION_STRING=postgresql://pocketid:${POCKETID_DB_PASSWORD}@pocketid-db:5432/pocketid
      - INTERNAL_BACKEND_URL=http://pocketid:80
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.routers.pocketid.tls.certresolver=letsencrypt"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"

  pocketid-db:
    image: postgres:18-alpine
    container_name: pocketid-db
    restart: unless-stopped
    networks:
      - pocketid-internal
    environment:
      - POSTGRES_DB=pocketid
      - POSTGRES_USER=pocketid
      - POSTGRES_PASSWORD=${POCKETID_DB_PASSWORD}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - pocketid-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketid"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    name: proxy
    external: true
  pocketid-internal:
    name: pocketid-internal
    internal: true

volumes:
  pocketid-db-data:
    name: pocketid-db-data
  tinyauth-data:
    name: tinyauth-data
