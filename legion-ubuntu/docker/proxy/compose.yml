services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - pocketid-internal
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - CF_API_EMAIL=${CF_API_EMAIL}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config:/etc/traefik
      - ./data:/data
    command:
      # API and Dashboard
      - --api.dashboard=true
      - --api.insecure=false

      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # Logging
      - --log.level=INFO
      - --accesslog=true

      # Let's Encrypt DNS-01 Challenge
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
    labels:
      - "traefik.enable=true"

      # Dashboard router - accessible at /api and /dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.priority=10"

  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocketid
    restart: unless-stopped
    depends_on:
      - pocketid-db
    networks:
      - proxy
      - pocketid-internal
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - PUBLIC_APP_URL=https://auth.${DOMAIN}
      - APP_URL=https://auth.${DOMAIN}
      - TRUST_PROXY=true
      - DATABASE_URL=postgresql://pocketid:${POCKETID_DB_PASSWORD}@pocketid-db:5432/pocketid
      - INTERNAL_BACKEND_URL=http://pocketid:80
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocketid.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.pocketid.entrypoints=websecure"
      - "traefik.http.routers.pocketid.tls=true"
      - "traefik.http.routers.pocketid.tls.certresolver=letsencrypt"
      - "traefik.http.services.pocketid.loadbalancer.server.port=1411"

  pocketid-db:
    image: postgres:18-alpine
    container_name: pocketid-db
    restart: unless-stopped
    networks:
      - pocketid-internal
    environment:
      - POSTGRES_DB=pocketid
      - POSTGRES_USER=pocketid
      - POSTGRES_PASSWORD=${POCKETID_DB_PASSWORD}
      - TZ=${TZ:-Australia/Melbourne}
    volumes:
      - pocketid-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketid"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    name: proxy
    external: true
  pocketid-internal:
    name: pocketid-internal
    internal: true

volumes:
  pocketid-db-data:
    name: pocketid-db-data
