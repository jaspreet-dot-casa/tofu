services:
  sftpgo:
    image: drakkan/sftpgo:v2
    container_name: sftpgo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - proxy
    ports:
      - "2022:2022"
    environment:
      - TZ=${TZ:-Australia/Melbourne}
      - SFTPGO_SFTPD__BINDINGS__0__PORT=2022
      - SFTPGO_HTTPD__BINDINGS__0__PORT=8080
    volumes:
      - ${HDD1_PATH}:/srv/sftpgo/data/hdd1
      - ${SSD2_PATH}:/srv/sftpgo/data/ssd2
      - ${SFTPGO_HOME_PATH}:/var/lib/sftpgo
      - ${SFTPGO_DATA_PATH}:/srv/sftpgo
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.services.sftpgo.loadbalancer.server.port=8080"

      - "traefik.http.routers.sftpgo.rule=Host(`sftp.${DOMAIN}`)"
      - "traefik.http.routers.sftpgo.entrypoints=websecure"
      - "traefik.http.routers.sftpgo.tls=true"
      - "traefik.http.routers.sftpgo.service=sftpgo"

      - "traefik.http.routers.sftpgo.middlewares=tinyauth@docker"

networks:
  proxy:
    name: proxy
    external: true

