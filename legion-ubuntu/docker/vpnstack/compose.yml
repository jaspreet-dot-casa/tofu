services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    env_file:
      - ./.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
      - WEBUI_PORT=13001  # default is 8080, changed to avoid conflict
      - TORRENTING_PORT=6881
    network_mode: "service:gluetun"
    volumes:
      - qbittorrent:/config
      - ${MEDIA_PATH}/qbittorrent/downloads:/downloads # This is where your torrents will be saved
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  gluetun:
    container_name: gluetun
    image: qmcgaw/gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:  # these are not exposed via ufw, accessible via Tailscale
      - 13001:13001  # qbitorrent
      - 9696:9696  # prowlarr
      - 13002:3000  # cinephage
      - 6881:6881/tcp
      - 6881:6881/udp
    env_file:
      - ./.env
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard # or openvpn
      - SERVER_COUNTRIES=Australia
    networks:
      - vpn
      - dashboard
      - proxy
    labels:
      - "traefik.enable=true"

      # qBittorrent router
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=13001"
      - "traefik.http.routers.qbittorrent.middlewares=security-headers@file"

      # Prowlarr router
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.middlewares=security-headers@file"

      # Cinephage router. Lives here rather than on the cinephage container because
      # that container shares this network namespace and has no interface of its own.
      - "traefik.http.routers.cinephage.rule=Host(`cine.${DOMAIN}`)"
      - "traefik.http.routers.cinephage.entrypoints=websecure"
      - "traefik.http.routers.cinephage.tls=true"
      - "traefik.http.routers.cinephage.service=cinephage"
      - "traefik.http.services.cinephage.loadbalancer.server.port=3000"
      - "traefik.http.routers.cinephage.middlewares=security-headers@file"

  # Didn't work for me but keeping it here for reference
  # Add this to ports in gluetun: `- 9117:9117  # jackett`
  # And add a volume for jackett_data at the bottom of the file.
  # jackett:
  #   image: lscr.io/linuxserver/jackett:latest
  #   container_name: jackett
  #   network_mode: "service:gluetun"
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #     - AUTO_UPDATE=true #optional
  #     - RUN_OPTS= #optional
  #   volumes:
  #     - jackett_data:/config
  #     - ${MEDIA_PATH}/qbittorrent/downloads/blackhole:/downloads
  #   depends_on:
  #     - gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000 # Your User ID
      - PGID=1000 # Your Group ID
      - TZ=Australia/Melbourne # Your Timezone (e.g., America/Denver, Australia/Brisbane)
    volumes:
      - prowlarr_data:/config # Host path for configuration data:container path
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

# Mediamanager stack
  mediamanager:
    container_name: mediamanager_server
    image: ghcr.io/tagpro/mediamanager/mediamanager:v0.1.0
    ports:
      - "13000:8000"
    environment:
      - CONFIG_DIR=/app/config
    networks:
      - vpn
      - dashboard
      - mediamanager
      - proxy
    env_file:
      - ./.env
    volumes:
      # Mount your actual media directories here - these paths should match your config.toml
      # This path is for media files (movies, tv shows, images).
      # Run command from README to create these folders before starting the container.
      - ${MEDIA_PATH}/mediamanager:/data/
      # Config folder for application configuration
      - ./config/:/app/config/
      # This maps from torrent download location in qbittorrent to torrent_directory in config.toml
      - ${MEDIA_PATH}/qbittorrent/downloads:/downloads
    depends_on:
      db:
        condition: service_healthy
      qbittorrent:
        condition: service_started
      prowlarr:
        condition: service_started
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mediamanager.rule=Host(`mediamanager.${DOMAIN}`)"
      - "traefik.http.routers.mediamanager.entrypoints=websecure"
      - "traefik.http.routers.mediamanager.tls=true"
      - "traefik.http.services.mediamanager.loadbalancer.server.port=8000"
      - "traefik.http.routers.mediamanager.middlewares=security-headers@file"

# Cinephage — intended replacement for the mediamanager stack above.
# Single service: it bundles the Radarr/Sonarr/Prowlarr/Bazarr roles in one process,
# so it needs neither prowlarr nor a database container (SQLite, see litestream below).
  cinephage:
    container_name: cinephage
    image: ghcr.io/moldytaint/cinephage:latest
    # Routed entirely through gluetun, so it has no direct internet path: its indexer
    # searches and TMDB calls exit over the VPN, and it dies with the tunnel.
    # Consequences of sharing the namespace: no `networks`, no `ports` and no Traefik
    # labels on this container — its port and router live on gluetun above.
    network_mode: "service:gluetun"
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
      - PORT=3000
      - ORIGIN=https://cine.${DOMAIN}
      - BETTER_AUTH_URL=https://cine.${DOMAIN}
    volumes:
      # /config holds the SQLite db (at /config/data/cinephage.db), indexer
      # definitions and the Camoufox cache.
      - ${CINEPHAGE_CONFIG_PATH}:/config
      # The whole media root, i.e. the same tree Jellyfin serves as /media. Mounting
      # the root (not movies/ and tv/ separately) keeps every library and the
      # downloads dir on one mount, so imports can hardlink instead of copying.
      - ${MEDIA_PATH}:/media
      # Deliberately the same container path qBittorrent uses for its own downloads,
      # so the torrent paths qBittorrent reports resolve as-is and no remote path
      # mapping is needed.
      - ${MEDIA_PATH}/qbittorrent/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    restart: unless-stopped

  # Continuously replicates Cinephage's SQLite WAL to a second physical disk.
  # Same pattern as gopodder — see this stack's README for the restore command.
  cinephage-litestream:
    container_name: cinephage-litestream
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    depends_on:
      - cinephage
    command: replicate -config /etc/litestream.yml
    environment:
      - TZ=Australia/Melbourne
    volumes:
      - ${CINEPHAGE_CONFIG_PATH}:/config
      - ${CINEPHAGE_BACKUP_PATH}:/backups
      - ./cinephage-litestream.yml:/etc/litestream.yml:ro

  db:
    container_name: mediamanager_postgres
    image: postgres:17
    restart: unless-stopped
    volumes:
      - mediamanager_postgres:/var/lib/postgresql/data
    networks:
      - mediamanager
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 1s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: MediaManager
      POSTGRES_DB: MediaManager
      POSTGRES_PASSWORD: MediaManager

volumes:
  qbittorrent:
  mediamanager_postgres:
  prowlarr_data:

networks:
  vpn:
    external: true
  dashboard:
    external: true
  proxy:
    external: true
  mediamanager:
