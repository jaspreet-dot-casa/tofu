services:
  arcane:
    # Pinned to the v3 major: crossing a major version needs a migration (see README).
    image: ghcr.io/getarcaneapp/manager:v3
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      # Same absolute path inside and out, so relative bind mounts in managed
      # projects resolve identically for Arcane and the Docker daemon.
      - ${ARCANE_PROJECTS_DIRECTORY:?set ARCANE_PROJECTS_DIRECTORY in .env}:${ARCANE_PROJECTS_DIRECTORY}
    # Every Arcane variable must carry the ARCANE_ prefix: v3 refuses to start
    # if .env still holds a pre-v3 name (APP_URL, ENCRYPTION_KEY, OIDC_*, ...).
    env_file:
      - .env
    environment:
      - ARCANE_APP_URL=https://arcane.${DOMAIN}
      - TZ=Australia/Melbourne
      - PUID=1000
      - PGID=1000
    # Host cgroup namespace, read by Arcane's system stats.
    cgroup: host
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s # covers database migrations on first boot
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arcane.rule=Host(`arcane.${DOMAIN}`)"
      - "traefik.http.routers.arcane.entrypoints=websecure"
      - "traefik.http.routers.arcane.tls=true"
      - "traefik.http.services.arcane.loadbalancer.server.port=3552"
      - "traefik.http.routers.arcane.middlewares=security-headers@file"

networks:
  proxy:
    external: true

volumes:
  arcane-data:
